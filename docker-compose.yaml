services:

  wordpress:
    image: ${COMPOSE_PROJECT_NAME}/wordpress-fpm:6.9.1
    build: ./wordpress-fpm
    container_name: ${WORDPRESS_SERVICE}
    restart: unless-stopped
    user: ${WORDPRESS_UID}:${WORDPRESS_GID}
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER_FILE=/run/secrets/db_user
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/db_password
      - WP_CLI_CACHE_DIR=/tmp/wp-cli-cache
    secrets:
      - db_user
      - db_password
    ports:
      - :9000
    volumes:
      - './data/wordpress:/var/www/html'
      - './php.ini-development:/usr/local/etc/php/conf.d/php.ini:ro'
    depends_on:
      - db

  db:
    # MariaDB 11.4 is the latest compatible database
    # https://make.wordpress.org/hosting/handbook/compatibility/
    image: mariadb:11.4
    container_name: ${DB_SERVICE}
    restart: always
    command: --innodb-use-native-aio=0
    environment:
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MARIADB_USER_FILE=/run/secrets/db_user
      - MARIADB_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_root_password
      - db_user
      - db_password
    volumes:
      - './data/mariadb:/var/lib/mysql'

  reverse_proxy:
    image: nginx:1.28.2-alpine
    container_name: ${REVERSE_PROXY_SERVICE}
    restart: unless-stopped
    ports:
      - ${HOST_HTTP_PORT}:80
    volumes:
      - './data/wordpress:/var/www/html'
      - './reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro'
    depends_on:
      - wordpress

  db_admin:
    image: adminer:5.4.2
    container_name: ${DB_ADMIN}
    restart: always
    environment:
      # Avaialble designs: https://github.com/vrana/adminer/tree/master/designs
      - ADMINER_DESIGN=nette
      - ADMINER_DEFAULT_SERVER=db
    ports:
      - 8080:8080
    depends_on:
      - db

networks:
  default:
    name: ${NETWORK_NAME}
    driver: bridge

secrets:
  db_root_password:
    file: ./secrets/db-root-password.txt
  db_user:
    file: ./secrets/db-user.txt
  db_password:
    file: ./secrets/db-password.txt
